name: Typescript Release

# On every push to main:
# - pending changesets: open or update the "chore: version packages" PR (as the maxyz-action app)
# - no pending changesets: publish the package.json version to npm if it is not published yet,
#   then tag vX.Y.Z and create a GitHub release if they do not exist yet
on:
  push:
    branches: [main]
    paths:
      - 'typescript/**'
      - '.github/workflows/typescript-release.yml'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # tags and GitHub releases
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    # Deployments restricted to the main branch
    environment: release
    defaults:
      run:
        working-directory: ./typescript

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23lin88uMBRaCQ5SzJ # maxyz-actions app
          private-key: ${{ secrets.MAXYZ_ACTIONS_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: typescript/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test:ci

      - name: Create version PR
        id: changesets
        uses: changesets/action@v2
        with:
          cwd: ./typescript
          version-script: pnpm changeset:version
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Publish to npm
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm"
          else
            npm publish --provenance --access public
          fi

      - name: Tag and create GitHub release
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already released"
            exit 0
          fi
          # Release notes: this version's section of CHANGELOG.md
          awk -v v="## $VERSION" '$0 == v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
